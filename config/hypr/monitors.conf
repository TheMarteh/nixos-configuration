################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# Schaal moet de resolutie deelbaar maken tot hele pixels: 2560x1440 / 1.333333 = 1920x1080.
# (1.3333 wordt afgerond naar 1.33 -> 1924.8px breed -> rendering-artifacts.)
monitor = DP-5, 2560x1440@75, 0x0, 1.333333

# Fallback voor elk ander (tijdelijk) aangesloten scherm
monitor = , preferred, auto, 1
