# Vergrendelscherm. Kleuren en font komen uit het actieve palet;
# ~/.config/current-theme is een symlink die `theme-set` verzet.
#
# Dit bestand is een out-of-store symlink: aanpassen werkt direct, zonder
# rebuild. hyprlock leest zijn config bij elke start opnieuw.
source = ~/.config/current-theme/hyprlock.conf

general {
    hide_cursor = true
}

# Het scherm zelf, vervaagd en gedimd.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.55
    vibrancy = 0.17
}

# De klok.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_family = $font
    font_size = 96
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    color = $subtext
    font_family = $font
    font_size = 20
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 12
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true

    outer_color = $accent
    inner_color = $surface
    font_color = $text
    check_color = $accent_alt
    fail_color = $red

    font_family = $font
    placeholder_text = Wachtwoord
    fail_text = $FAIL ($ATTEMPTS)
    fade_on_empty = false

    position = 0, -40
    halign = center
    valign = center
}
