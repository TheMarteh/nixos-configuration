
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hyprland.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

###################
### MY PROGRAMS ###
###################
# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = alacritty
$fileManager = dolphin
$menu = rofi -show drun -run-command "uwsm app -- {cmd}"


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & firefox


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GDK_SCALE, 1

# NVIDIA (https://wiki.hyprland.org/Nvidia/)
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

# Hardware cursors op NVIDIA geven een "ghost" muispointer
cursor {
    no_hardware_cursors = true
}

xwayland {
    force_zero_scaling = true
}


source = ~/.config/hypr/permissions.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/input.conf

#############################
### AUTOSTART APPLICATION ###
#############################

exec-once = uwsm app -- waybar
exec-once = uwsm app -- awww-daemon
# swaync niet via exec-once: het pakket levert een D-Bus-geactiveerde
# swaync.service (BusName org.freedesktop.Notifications). Handmatig starten gaf
# een tweede instantie die de busnaam niet kon claimen -> unit in restart-loop.
exec-once = uwsm app -- blueman-applet
exec-once = uwsm app -- nm-applet --indicator

source = ~/.config/hypr/keybindings.conf

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrule {
    name = suppress-maximize-events
    suppress_event = maximize
    match:class = .*
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    no_focus = true
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
}

# Fix RuneLite (Bolt) tooltip/hover flicker: its Swing popups are floating XWayland
# windows (class net-runelite-client-RuneLite, title winNNN). With follow_mouse=1 they
# steal focus on hover, causing the main window to hide the tooltip in a flicker loop.
windowrule {
    name = runelite-tooltip-flicker
    no_focus = true
    match:class = ^(net-runelite-client-RuneLite)$
    match:title = ^(win\d+)$
    match:float = true
}
